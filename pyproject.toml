[project]
name = "pytherapy"
version = "0.1.0"
description = "Affordance engine for therapeutic protocols"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{name = "psychedel", email = "orion.bytes@gmail.com"}]
requires-python = ">=3.13"
dependencies = ["attrs>=24.2.0", "anthropic>=0.40.0"]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that require ANTHROPIC_API_KEY and make real API calls",
]
